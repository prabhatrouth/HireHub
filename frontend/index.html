<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Responsive -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- SEO -->
    <title>HireHub | Job Recruitment & Career Platform</title>

    <meta
      name="description"
      content="HireHub is a modern job recruitment platform where job seekers can find opportunities and employers can discover talented candidates."
    />

    <meta
      name="keywords"
      content="HireHub, jobs, job portal, job search, recruitment, hiring, careers, job vacancies, employment, applicant tracking"
    />

    <meta name="author" content="HireHub" />
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow" />

    <!-- Canonical -->
    <link
      rel="canonical"
      href="https://hire-hub-sigma-seven.vercel.app/"
    />

    <!-- Theme -->
    <meta name="theme-color" content="#2563eb" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HireHub" />
    <meta
      property="og:title"
      content="HireHub | Job Recruitment & Career Platform"
    />
    <meta
      property="og:description"
      content="Find jobs, discover career opportunities, and connect with employers on HireHub."
    />
    <meta
      property="og:url"
      content="https://hire-hub-sigma-seven.vercel.app/"
    />
    <meta
      property="og:image"
      content="https://hire-hub-sigma-seven.vercel.app/logo.png"
    />
    <meta
      property="og:image:alt"
      content="HireHub Logo"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="HireHub | Job Recruitment & Career Platform"
    />
    <meta
      name="twitter:description"
      content="Find jobs, discover career opportunities, and connect with employers on HireHub."
    />
    <meta
      name="twitter:image"
      content="https://hire-hub-sigma-seven.vercel.app/logo.png"
    />

    <!-- Website Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "HireHub",
        "url": "https://hire-hub-sigma-seven.vercel.app/",
        "description": "HireHub is a modern job recruitment and career platform."
      }
    </script>

    <!-- Organization Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "HireHub",
        "url": "https://hire-hub-sigma-seven.vercel.app/",
        "logo": "https://hire-hub-sigma-seven.vercel.app/logo.png"
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
